# Optional nginx-rtmp receiver.
# Include this http/server block in an nginx build that has the RTMP module.

worker_processes auto;

events {
  worker_connections 1024;
}

rtmp {
  server {
    listen 1935;
    chunk_size 4096;

    application live {
      live on;
      record off;
      allow publish all;
      allow play all;
    }
  }
}

http {
  server {
    listen 8088;

    location /stat {
      rtmp_stat all;
      rtmp_stat_stylesheet stat.xsl;
    }

    location /stat.xsl {
      root html;
    }
  }
}
